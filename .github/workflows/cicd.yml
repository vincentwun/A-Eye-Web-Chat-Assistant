name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.16.0"

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci # Install dependencies
      - run: npm run typecheck
      - run: npm audit --audit-level=high # SCA - Dependency audit
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [validate, codeql]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npm run verify:build

      - name: ZIP Extension
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(jq -er '.version' .output/chrome-mv3/manifest.json)
          ZIP="a-eye-web-chat-assistant-v${VERSION}-chrome.zip"

          mkdir -p release

          cd .output/chrome-mv3
          zip -qr "../../release/$ZIP" .

          cd ../../release
          unzip -t "$ZIP"
          sha256sum "$ZIP" > SHA256SUMS

      - name: Upload ZIP File
        uses: actions/upload-artifact@v7
        with:
          name: a-eye-web-chat-release
          path: release/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
